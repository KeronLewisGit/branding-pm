server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    # Security headers for STATIC responses only. PHP responses get the full
    # set from App\Http\Middleware\SecurityHeaders — and nginx `add_header`
    # does not replace a header the upstream already sent, it appends a second
    # one. This file previously sent SAMEORIGIN while the application sends
    # DENY, so every page carried two contradictory X-Frame-Options values and
    # which one applied was the browser's choice.
    #
    # `always` so they are present on error responses too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Do not advertise the nginx version (OWASP: minimise fingerprinting).
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
