# ---------------------------------------------------------------------------
# Client address and scheme, with or without a TLS terminator in front
# ---------------------------------------------------------------------------
#
# nginx is the edge in the plain-HTTP setup and is NOT the edge once the
# `caddy` service is running. These maps make one configuration correct for
# both, instead of a second config file that drifts.
#
# `geo` classifies the immediate peer. Only a peer on a private network may
# have its X-Forwarded-* believed; anything else gets nginx's own view, so a
# request arriving straight off the network cannot dictate its own address.
geo $from_private_peer {
    default        0;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
    127.0.0.1/32   1;
    ::1/128        1;
}

# Scheme: Caddy terminates TLS and speaks plain HTTP to nginx, so $scheme here
# is always "http". Taking $scheme would tell Laravel the request was insecure
# on every HTTPS page — no HSTS, and http:// in every generated URL.
map "$from_private_peer:$http_x_forwarded_proto" $client_proto {
    default   $scheme;
    "1:https" https;
    "1:http"  http;
}

# Client address, in two steps because a map cannot enumerate arbitrary values
# and an absent header must still fall back rather than forward an empty one.
map $from_private_peer $forwarded_client {
    default "";
    1       $http_x_forwarded_for;
}

map $forwarded_client $client_addr {
    default $forwarded_client;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    # Security headers for STATIC responses only. PHP responses get the full
    # set from App\Http\Middleware\SecurityHeaders — and nginx `add_header`
    # does not replace a header the upstream already sent, it appends a second
    # one. This file previously sent SAMEORIGIN while the application sends
    # DENY, so every page carried two contradictory X-Frame-Options values and
    # which one applied was the browser's choice.
    #
    # `always` so they are present on error responses too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Do not advertise the nginx version (OWASP: minimise fingerprinting).
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Forward the client's address and scheme so the audit log records who
        # acted, not which machine relayed it, and so Laravel knows a request
        # is HTTPS when TLS is terminated in front of this server.
        #
        # `include fastcgi_params` sets REMOTE_ADDR from nginx's own view of
        # the peer. That is correct when nginx is the edge, and wrong the
        # moment anything sits in front — a load balancer, a TLS terminator,
        # or Docker's published-port NAT.
        #
        # Laravel only reads these from a trusted proxy; see the
        # trustProxies() call in bootstrap/app.php.
        #
        # $remote_addr, NOT $proxy_add_x_forwarded_for. The latter APPENDS to
        # whatever the client sent, so a request carrying its own
        # "X-Forwarded-For: 203.0.113.9" ends up logged as 203.0.113.9 —
        # a forgeable audit trail, which is worse than an unhelpful one.
        # Verified by trying it. nginx is the edge here, so it overwrites the
        # header with what it can actually see.
        #
        # That is what the maps at the top of this file now do: a private peer
        # (the `caddy` service) is believed, anything else is not.
        #
        # ⚠ While nginx's own port is still published to the host, this is
        # only half a control. Docker's published-port NAT rewrites the source
        # of a direct request to the bridge gateway — a private address — so
        # nginx cannot tell "came through Caddy" from "came straight to 8088".
        # Someone reaching the plain port could therefore claim
        # `X-Forwarded-Proto: https`.
        #
        # The fix is not more nginx configuration: it is to stop publishing
        # this port once TLS is live, so Caddy is the only way in. See the
        # `caddy` service in docker-compose.yml.
        fastcgi_param HTTP_X_FORWARDED_FOR   $client_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $client_proto;

        # X-Forwarded-Host and -Port are deliberately NOT sent.
        #
        # nginx's $host omits the port, and a trusted X-Forwarded-Host makes
        # Laravel rebuild request URLs from it — so `:8088` vanished and every
        # signed URL failed to validate. Kiosk enrolment broke completely, and
        # it broke silently: a 403 that looks exactly like an expired link.
        #
        # They are also the least useful of the four. A trusted
        # X-Forwarded-Host is a host-header poisoning vector, and APP_URL
        # already tells the application what it is called.
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
