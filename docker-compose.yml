# Optional Docker runtime. Native PHP (artisan serve / Laragon / Herd / XAMPP)
# remains fully supported — only .env values differ (see the Docker block in
# .env.example: DB_HOST=mysql etc).
services:
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - .:/var/www/html
        depends_on:
            mysql:
                condition: service_healthy

    nginx:
        image: nginx:1.27-alpine
        ports:
            - '8080:80'
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php

    mysql:
        image: mysql:8
        environment:
            MYSQL_DATABASE: branding_pm
            MYSQL_USER: branding_pm
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: secret
        command: '--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci'
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-psecret']
            interval: 5s
            timeout: 5s
            retries: 10

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command: php artisan schedule:work
        volumes:
            - .:/var/www/html
        depends_on:
            mysql:
                condition: service_healthy

volumes:
    mysql-data:
