# Optional Docker runtime. Native PHP (artisan serve / Laragon / Herd / XAMPP)
# remains fully supported — only .env values differ (see the Docker block in
# .env.example: DB_HOST=mysql etc).
services:
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        environment:
            # Bind-mounted vendor/ on Windows/macOS is slow enough that
            # unzipping large packages exceeds Composer's 300s default.
            COMPOSER_PROCESS_TIMEOUT: 0
        # php-fpm's master runs as root but its workers run as www-data, while
        # `docker compose exec php php artisan …` runs as root — so artisan
        # leaves root-owned 0644 files in storage/ (laravel.log, the file
        # cache, compiled views) that the workers then cannot rewrite. The
        # symptom is a 500 on every authenticated page, because @can() makes
        # spatie/laravel-permission write its cache. Re-open those on start.
        command: >-
            sh -c "chmod -R a+rwX storage bootstrap/cache 2>/dev/null || true; exec php-fpm"
        volumes:
            - .:/var/www/html
            # vendor/ lives in a named volume, NOT on the host filesystem:
            # thousands of small files over a bind mount make both Composer
            # and every request dramatically slower on Docker Desktop.
            # Consequence: vendor/ is not visible from Windows. Run composer
            # through `docker compose exec php`, never from the host.
            - vendor:/var/www/html/vendor
        depends_on:
            mysql:
                condition: service_healthy

    nginx:
        image: nginx:1.27-alpine
        # Host port is configurable: 8080 is a popular port and is often already
        # taken (Docker's own WSL relay grabs it on some Windows setups).
        # Override with APP_PORT in .env.
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php

    mysql:
        image: mysql:8
        environment:
            # Local development defaults. Read from the environment so a
            # shared or exposed box can be given real ones without editing a
            # tracked file — this compose file is committed, so anything
            # written here is a published credential.
            MYSQL_DATABASE: ${DB_DATABASE:-branding_pm}
            MYSQL_USER: ${DB_USERNAME:-branding_pm}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
        command: '--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci'
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p"$$MYSQL_ROOT_PASSWORD"']
            interval: 5s
            timeout: 5s
            retries: 10

    # Mail server for the pilot. Mailpit accepts SMTP on 1025 and shows every
    # message in a web inbox on 8025 — nothing leaves the machine.
    #
    # This is deliberate, not a stand-in that was never replaced. The plant
    # network has no mail relay of its own, and a password reset that silently
    # vanishes into a misconfigured smarthost is worse than one you can watch
    # arrive. Point MAIL_HOST/MAIL_PORT at the company relay on go-live and
    # this service can be dropped; nothing in the application refers to it.
    mailpit:
        image: axllent/mailpit:latest
        ports:
            # Inbox. Same host as the app, so http://<host>:8025 on the pilot.
            - '${MAIL_UI_PORT:-8025}:8025'
        environment:
            MP_MAX_MESSAGES: 500
            # Retain what has been read; the inbox is a support tool here, not
            # a test fixture that wants wiping between runs.
            MP_DATABASE: /data/mailpit.db
        volumes:
            - mailpit-data:/data
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://localhost:8025/api/v1/info']
            interval: 10s
            timeout: 5s
            retries: 5

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command: php artisan schedule:work
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
        depends_on:
            mysql:
                condition: service_healthy

volumes:
    mysql-data:
    mailpit-data:
    vendor:
