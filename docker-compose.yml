# Optional Docker runtime. Native PHP (artisan serve / Laragon / Herd / XAMPP)
# remains fully supported — only .env values differ (see the Docker block in
# .env.example: DB_HOST=mysql etc).
services:
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        environment:
            # Bind-mounted vendor/ on Windows/macOS is slow enough that
            # unzipping large packages exceeds Composer's 300s default.
            COMPOSER_PROCESS_TIMEOUT: 0
        # php-fpm's master runs as root but its workers run as www-data, while
        # `docker compose exec php php artisan …` runs as root — so artisan
        # leaves root-owned 0644 files in storage/ (laravel.log, the file
        # cache, compiled views) that the workers then cannot rewrite. The
        # symptom is a 500 on every authenticated page, because @can() makes
        # spatie/laravel-permission write its cache. Re-open those on start.
        command: >-
            sh -c "chmod -R a+rwX storage bootstrap/cache 2>/dev/null || true; exec php-fpm"
        volumes:
            - .:/var/www/html
            # vendor/ lives in a named volume, NOT on the host filesystem:
            # thousands of small files over a bind mount make both Composer
            # and every request dramatically slower on Docker Desktop.
            # Consequence: vendor/ is not visible from Windows. Run composer
            # through `docker compose exec php`, never from the host.
            - vendor:/var/www/html/vendor
        depends_on:
            mysql:
                condition: service_healthy

    nginx:
        image: nginx:1.27-alpine
        # Host port is configurable: 8080 is a popular port and is often already
        # taken (Docker's own WSL relay grabs it on some Windows setups).
        # Override with APP_PORT in .env.
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php

    mysql:
        image: mysql:8
        environment:
            # Local development defaults. Read from the environment so a
            # shared or exposed box can be given real ones without editing a
            # tracked file — this compose file is committed, so anything
            # written here is a published credential.
            MYSQL_DATABASE: ${DB_DATABASE:-branding_pm}
            MYSQL_USER: ${DB_USERNAME:-branding_pm}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
        command: '--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci'
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p"$$MYSQL_ROOT_PASSWORD"']
            interval: 5s
            timeout: 5s
            retries: 10

    # Nightly database backup.
    #
    # Built from the same mysql image as the server so mysqldump is always
    # version-matched, and kept separate from `php` so backups do not depend
    # on the application being healthy.
    #
    # Dumps land in ./storage/backups on the HOST, not in a named volume:
    # `docker compose down -v` destroys the database volume, and a backup
    # stored in one would go with it.
    backup:
        image: mysql:8
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
            DB_DATABASE: ${DB_DATABASE:-branding_pm}
            DB_HOST: mysql
            BACKUP_TIME: ${BACKUP_TIME:-02:30}
            BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
            TZ: ${APP_DISPLAY_TIMEZONE:-UTC}
        entrypoint: ['/usr/local/bin/backup.sh', 'loop']
        volumes:
            - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
            - ./storage/backups:/backups
            # Signatures and fault photos. Read-only: this container's job is
            # to copy them, and it must not be able to damage the originals.
            - ./storage/app:/appdata:ro
        depends_on:
            mysql:
                condition: service_healthy

    # Copies the nightly dumps to the network share.
    #
    # Behind the `offsite` profile, so it only starts when you ask for it:
    #
    #     docker compose --profile offsite up -d
    #
    # That is not decoration. The CIFS volume below is mounted by Docker at
    # container start, and a wrong password or an unreachable file server
    # makes that mount fail. Without the profile, a broken share would stop
    # `docker compose up` — and with it, the whole application — over a
    # secondary copy. Behind it, the worst case is no off-site copy, which
    # `backup:status` then reports.
    #
    # It is also a separate service from `backup` for the same reason: the
    # nightly dump must still be taken when the file server is down.
    backup-offsite:
        image: mysql:8
        restart: unless-stopped
        profiles: ['offsite']
        environment:
            BACKUP_OFFSITE_TIME: ${BACKUP_OFFSITE_TIME:-03:30}
            BACKUP_OFFSITE_RETENTION_DAYS: ${BACKUP_OFFSITE_RETENTION_DAYS:-30}
            BACKUP_OFFSITE_LABEL: ${BACKUP_OFFSITE_SHARE:-network share}
            TZ: ${APP_DISPLAY_TIMEZONE:-UTC}
        entrypoint: ['/usr/local/bin/offsite.sh', 'loop']
        volumes:
            - ./docker/backup/offsite.sh:/usr/local/bin/offsite.sh:ro
            - ./storage/backups:/backups
            - offsite:/offsite

    # Mail server for the pilot. Mailpit accepts SMTP on 1025 and shows every
    # message in a web inbox on 8025 — nothing leaves the machine.
    #
    # This is deliberate, not a stand-in that was never replaced. The plant
    # network has no mail relay of its own, and a password reset that silently
    # vanishes into a misconfigured smarthost is worse than one you can watch
    # arrive. Point MAIL_HOST/MAIL_PORT at the company relay on go-live and
    # this service can be dropped; nothing in the application refers to it.
    mailpit:
        image: axllent/mailpit:latest
        ports:
            # Inbox. Same host as the app, so http://<host>:8025 on the pilot.
            - '${MAIL_UI_PORT:-8025}:8025'
        environment:
            MP_MAX_MESSAGES: 500
            # Retain what has been read; the inbox is a support tool here, not
            # a test fixture that wants wiping between runs.
            MP_DATABASE: /data/mailpit.db
        volumes:
            - mailpit-data:/data
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://localhost:8025/api/v1/info']
            interval: 10s
            timeout: 5s
            retries: 5

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command: php artisan schedule:work
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
        depends_on:
            mysql:
                condition: service_healthy

volumes:
    mysql-data:
    mailpit-data:
    vendor:

    # The network share, mounted by Docker as a CIFS filesystem.
    #
    # Credentials come from .env (which is gitignored) and never from this
    # file, which is committed — anything written here is a published
    # credential. Give the service account write access to the share and
    # nothing else; it holds every password and PIN hash in the plant.
    #
    # vers=3.0 is the floor worth accepting: SMB1 is deprecated, unencrypted
    # and disabled by default on current Windows Server. If the share refuses
    # 3.0, fix the share rather than lowering this.
    offsite:
        driver: local
        driver_opts:
            type: cifs
            device: ${BACKUP_OFFSITE_SHARE:-//localhost/nonexistent}
            o: username=${BACKUP_OFFSITE_USERNAME:-},password=${BACKUP_OFFSITE_PASSWORD:-},vers=${BACKUP_OFFSITE_SMB_VERSION:-3.0},uid=0,gid=0,file_mode=0640,dir_mode=0750
